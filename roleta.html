<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roleta Sanka — Homologação</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#EA580C" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{margin:0;background:#0a0a0a;color:#f5efe6;font-family:"Space Grotesk",system-ui,sans-serif}.rl-page{min-height:100vh}.rl-head{height:68px;border-bottom:1px solid #292524;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.rl-logo{font-family:Anton,sans-serif;font-size:24px;letter-spacing:2px;color:#f5efe6;text-decoration:none}.rl-logo span,.rl-eyebrow{color:#ea580c}.rl-link{color:#d6d3d1;text-decoration:none}.rl-main{width:min(560px,calc(100% - 32px));margin:0 auto;padding:44px 0 72px;text-align:center}.rl-eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:700}.rl-main h1{font-family:Anton,sans-serif;font-size:clamp(38px,9vw,66px);line-height:1;margin:10px 0 30px}.rl-main h1 em{color:#ea580c;font-style:normal}.rl-card{background:#141210;border:1px solid #292524;border-radius:18px;padding:24px}.rl-disabled{margin-top:28px}.rl-big{font-size:54px}.rl-disabled h2,.rl-result h2{font-family:Anton,sans-serif;letter-spacing:2px;font-size:30px}.rl-muted,.rl-card p{color:#a8a29e;line-height:1.6}.rl-wheel-wrap{position:relative;width:min(330px,82vw);aspect-ratio:1;margin:0 auto 28px}.rl-wheel{position:absolute;inset:0;border-radius:50%;border:8px solid #1c1917;box-shadow:0 0 45px #ea580c33;transition:transform 2.2s cubic-bezier(.16,.68,.16,1)}.rl-wheel-center{position:absolute;inset:36%;border-radius:50%;background:#0a0a0a;border:4px solid #f5efe6;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:42px;color:#ea580c}.rl-pointer{position:absolute;z-index:2;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid #f5efe6}.rl-controls{display:grid;gap:12px;text-align:left}.rl-controls label{font-weight:700}.rl-controls input{width:100%;box-sizing:border-box;background:#0a0a0a;border:1px solid #44403c;color:#f5efe6;border-radius:10px;padding:14px;font-size:16px}.rl-controls button{border:0;border-radius:10px;padding:15px;background:#ea580c;color:#fff;font-family:Anton,sans-serif;letter-spacing:2px;font-size:18px;cursor:pointer}.rl-controls button:disabled{opacity:.45;cursor:not-allowed}.rl-controls p{font-size:12px;text-align:center;margin:0}.rl-result{margin-top:20px}.rl-result code{display:inline-block;background:#0a0a0a;border:1px dashed #ea580c;border-radius:8px;padding:12px 16px;color:#fbbf24;font-size:18px;letter-spacing:2px}.rl-error{margin-top:16px;background:#450a0a;border:1px solid #991b1b;color:#fecaca;padding:12px;border-radius:10px}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="/dist/roleta.js"></script>
</body>
</html>
